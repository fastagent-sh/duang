version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, github_actions]
    groups:
      github-actions:
        patterns: ['*']

# npm version-update automation is not enabled. FastAgent is pinned to an exact
# version and bumped with the change that consumes it; review other npm updates
# in ordinary PRs.
