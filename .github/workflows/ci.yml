name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a push run on main: its conclusion is the required status for that commit.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-checks:
    # Stable check name for future branch protection; no unsupported OS matrix yet.
    name: Desktop checks
    # macOS is the only supported target, and the smoke step launches a real Electron window:
    # on a Linux runner that needs xvfb plus a disabled Chromium sandbox, which is neither the
    # platform we ship nor a configuration worth asserting against. Still no packaging or signing.
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: duang
    steps:
      - name: Check out duang
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: duang
          persist-credentials: false

      - name: Read the pinned FastAgent revision
        id: fastagent
        run: |
          read -r revision < .github/fastagent-revision
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full FastAgent commit SHA" >&2; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # package.json uses file:../fastagent. Both repositories must be siblings,
      # and FastAgent must be built before duang installs/loads its linked package.
      - name: Check out FastAgent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fastagent-sh/fastagent
          ref: ${{ steps.fastagent.outputs.revision }}
          path: fastagent
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            duang/package-lock.json
            fastagent/package-lock.json

      - name: Install and build FastAgent
        working-directory: fastagent
        run: npm ci && npm run build

      - name: Install duang
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck and build the Electron application
        run: npm run build

      - name: Electron local-workflow smoke (isolated fake provider)
        run: node tests/smoke.mjs
