# Unsigned until there is an Apple Developer ID: a first open needs Privacy & Security → Open Anyway.
# app.asar ships `dependencies` only; the renderer is bundled by Vite. `hono` is a direct dependency because
# electron-builder leaves out @hono/node-server's peer; tests/packaged.mjs catches such gaps (fastagent#724).
appId: sh.fastagent.duang
productName: duang
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
  # Ad-hoc signing: Apple silicon requires it to run at all.
  identity: "-"
  hardenedRuntime: false
dmg:
  writeUpdateInfo: false
